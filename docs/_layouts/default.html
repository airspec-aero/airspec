<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
    <meta name="description" content="{{ page.description | default: site.description | escape }}">
    <link rel="canonical" href="{{ page.url | absolute_url }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#content">Skip to content</a>
    <header>
      <a class="brand" href="{{ '/' | relative_url }}" aria-label="AirSpec home">
        <img src="{{ '/assets/logos/Airspec Logo - Dark.jpg' | relative_url }}" width="1700" height="1700" alt="AirSpec — Aviation Interpreted Rules Specification">
      </a>
      <nav aria-label="Project links">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/blog/' | relative_url }}"{% if page.url == '/blog/' %} aria-current="page"{% endif %}>Blog</a>
        <a href="https://github.com/airspec-aero/airspec">GitHub</a>
        <a href="https://www.linkedin.com/groups/42821328/">LinkedIn</a>
      </nav>
    </header>
    <main id="content" tabindex="-1">{{ content }}</main>
    <footer>
      <span>AirSpec</span>
      <a href="https://github.com/airspec-aero/airspec/blob/main/LICENSE">Apache License 2.0</a>
    </footer>
  </body>
</html>
