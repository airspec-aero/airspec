---
layout: default
---
<article>
  <h1>{{ page.title | escape }}</h1>
  <p class="post-date"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%-d %B %Y' }}</time></p>
  {{ content }}
</article>
<p class="back-link"><a href="{{ '/blog/' | relative_url }}">← All posts</a></p>
