<svg xmlns="http://www.w3.org/2000/svg" width="360" height="270" viewBox="0 0 360 270" role="img" aria-labelledby="title desc">
  <title id="title">Rest as its own entity</title>
  <desc id="desc">The same two duties and rest interval, with rest represented as an entity connected to both duties. The duration is a property of the rest entity.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f9ed5"/>
    </marker>
  </defs>
  <rect x="1" y="1" width="358" height="268" rx="12" fill="#fff" stroke="#ccd3df"/>
  <g font-family="Poppins, Arial, sans-serif" fill="#002060">
    <text x="180" y="37" text-anchor="middle" font-size="21" font-weight="700">Rest as its own entity</text>
    <path d="M 100 102 H 260" fill="none" stroke="#0f9ed5" stroke-width="2"/>
    <rect x="20" y="78" width="80" height="48" rx="6" fill="#002060"/>
    <rect x="260" y="78" width="80" height="48" rx="6" fill="#002060"/>
    <rect x="130" y="78" width="100" height="48" rx="6" fill="#dff3fb" stroke="#0f9ed5" stroke-width="2"/>
    <g font-size="18" text-anchor="middle">
      <text x="60" y="109" fill="#fff">Duty 1</text>
      <text x="180" y="109">Rest</text>
      <text x="300" y="109" fill="#fff">Duty 2</text>
    </g>
    <path d="M 180 194 V 138" fill="none" stroke="#0f9ed5" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="180" y="224" text-anchor="middle" font-family="monospace" font-size="16">rest.duration</text>
  </g>
</svg>
